engine:
  amount_epsilon: 0.05
  date_days_tolerance: 3
  run_mode: TOLERANT
matching:
  enable_fuzzy_matching: true
  fuzzy_secondary_keys:
  - mobile
  - email
  fuzzy_threshold: 0.9
  primary_key: pan
  source_overrides:
    CAMS:
      enable_fuzzy_matching: true
      fuzzy_threshold: 0.88
reporting:
  default_output_formats:
  - excel
  - csv
  - json
  redact_sensitive_fields: false
  severity_mappings:
    AMOUNT_MISMATCH: CRITICAL
    DATE_MISMATCH: LOW
    EMAIL_MISMATCH: MEDIUM
    FATCA_MISMATCH: HIGH
    FIELD_EMPTY: MEDIUM
    FIELD_MISSING: MEDIUM
    INCOMPLETE_CRM_RECORD: MEDIUM
    KYC_MISMATCH: MEDIUM
    MISSING_IN_CRM: CRITICAL
    MISSING_IN_REPORT: HIGH
    MOBILE_MISMATCH: MEDIUM
    NAME_MISMATCH: HIGH
sources:
